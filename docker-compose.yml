services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labaide
      POSTGRES_USER: labaide
      POSTGRES_PASSWORD: labaide
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labaide"]
      interval: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: Lab_Aide.settings.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
