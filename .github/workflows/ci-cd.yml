# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DJANGO_SETTINGS_MODULE: Lab_Aide.settings

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      # Optional: PostgreSQL service for testing
      # postgres:
      #   image: postgres:15-alpine
      #   env:
      #     POSTGRES_PASSWORD: postgres
      #     POSTGRES_DB: test_db
      #   options: >-
      #     --health-cmd pg_isready
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 5
      #   ports:
      #     - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest coverage
        pip install django-crispy-forms crispy-bootstrap5 matplotlib numpy
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run Django tests
      env:
        DEBUG: False
        SECRET_KEY: django-insecure-test-key
        ALLOWED_HOSTS: localhost
        # DB_ENGINE: django.db.backends.postgresql
        # DB_NAME: test_db
        # DB_USER: postgres
        # DB_PASSWORD: postgres
        # DB_HOST: localhost
        # DB_PORT: 5432
      run: |
        python manage.py test --verbosity=2
    
    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/labaide:latest
          ${{ secrets.DOCKER_USERNAME }}/labaide:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to server (example)
      run: |
        echo "Deploying to production server..."
        # Add your deployment commands here
        # Example with SSH:
        # ssh user@server "cd /app && docker-compose pull && docker-compose up -d"
