[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/settings/*.py" = ["F405", "F403"]
"*/settings.py" = ["F405", "F403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "Lab_Aide.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=70"
